<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BorionAI — Before/After Mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Brand tokens — applied per-artboard so they don't leak to the canvas chrome */
  .b-frame{
    --navy: #141e42;
    --navy-mid: #0d3084;
    --blue: #195add;
    --purple: #6f5dd2;
    --lavender: #d2ccf1;
    --offwhite: #f7f7f7;
    --white: #ffffff;
    --line: rgba(210, 204, 241, 0.12);
    --line-strong: rgba(210, 204, 241, 0.22);
    --muted: rgba(247, 247, 247, 0.72);
    --dim: rgba(247, 247, 247, 0.55);

    width: 100%;
    height: 100%;
    background: var(--navy);
    color: var(--white);
    font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    position: relative;
  }
  .b-frame .head{
    font-family: 'Inter Tight', 'Manrope', ui-sans-serif, system-ui, sans-serif;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.05;
  }

  /* ============================================
     HERO — BEFORE
     Mid-blue gradient + competing canvas + flat
     ============================================ */
  .hero-before{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(25,90,221,0.55) 0%, transparent 60%),
      linear-gradient(180deg, #1d3aa8 0%, #195add 60%, #2a6bee 100%);
  }
  .hero-before .canvas-mock{
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.95;
    background:
      radial-gradient(circle at 18% 30%, rgba(255,255,255,0.5) 0px, rgba(255,255,255,0.5) 2px, transparent 3px),
      radial-gradient(circle at 32% 60%, rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 2px, transparent 3px),
      radial-gradient(circle at 48% 22%, rgba(255,255,255,0.6) 0px, rgba(255,255,255,0.6) 2.5px, transparent 4px),
      radial-gradient(circle at 65% 48%, rgba(255,255,255,0.45) 0px, rgba(255,255,255,0.45) 2px, transparent 3px),
      radial-gradient(circle at 78% 18%, rgba(255,255,255,0.5) 0px, rgba(255,255,255,0.5) 2px, transparent 3px),
      radial-gradient(circle at 22% 80%, rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 2px, transparent 3px),
      radial-gradient(circle at 88% 70%, rgba(255,255,255,0.55) 0px, rgba(255,255,255,0.55) 2.5px, transparent 4px),
      radial-gradient(circle at 55% 85%, rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 2px, transparent 3px),
      radial-gradient(circle at 8% 50%, rgba(255,255,255,0.5) 0px, rgba(255,255,255,0.5) 2px, transparent 3px),
      radial-gradient(circle at 92% 35%, rgba(255,255,255,0.45) 0px, rgba(255,255,255,0.45) 2px, transparent 3px),
      radial-gradient(circle at 38% 90%, rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 2px, transparent 3px),
      radial-gradient(circle at 70% 92%, rgba(255,255,255,0.5) 0px, rgba(255,255,255,0.5) 2px, transparent 3px);
  }
  .hero-before .canvas-mock svg{ position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.4; }
  .hero-before .nav{
    position: absolute; top: 0; left: 0; right: 0; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 56px; border-bottom: 1px solid rgba(255,255,255,0.12);
    background: rgba(20,30,66,0.4); backdrop-filter: blur(8px);
    z-index: 5;
  }
  .hero-before .nav .lg{ font-weight: 600; font-size: 18px; letter-spacing: -0.02em; }
  .hero-before .nav ul{ list-style: none; display: flex; gap: 28px; padding: 0; margin: 0; font-size: 13px; color: rgba(255,255,255,0.85); }
  .hero-before .nav .nav-cta{ background: white; color: #141e42; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .hero-before .content{
    position: absolute; inset: 64px 0 0 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 0 80px;
    z-index: 4;
  }
  .hero-before .content-inner{ max-width: 880px; }
  .hero-before h1{
    font-family: 'Inter Tight', sans-serif;
    font-weight: 500;
    font-size: 76px;
    line-height: 1.05;
    letter-spacing: -0.025em;
    margin: 0 0 24px;
    color: white;
    text-shadow: 0 2px 20px rgba(0,0,0,0.2);
  }
  .hero-before h1 em{ font-style: normal; color: #ffe7a8; }
  .hero-before .sub{
    font-size: 19px; color: rgba(255,255,255,0.92);
    max-width: 720px; margin: 0 auto 36px; line-height: 1.55;
  }
  .hero-before .ctas{ display: flex; gap: 14px; justify-content: center; }
  .hero-before .btn{
    padding: 14px 26px; border-radius: 10px; font-weight: 600;
    font-size: 14px; font-family: 'Manrope', sans-serif;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .hero-before .btn-1{ background: white; color: #141e42; }
  .hero-before .btn-2{ background: #195add; color: white; border: 1px solid rgba(255,255,255,0.4); }
  .hero-before .btn-3{ background: rgba(255,255,255,0.12); color: white; border: 1px solid rgba(255,255,255,0.3); }
  .hero-before .badge-row{
    display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;
  }
  .hero-before .badge{
    padding: 5px 12px; border-radius: 999px;
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    font-size: 11px; color: white; font-weight: 600;
  }

  /* ============================================
     HERO — AFTER
     Deep navy. Single hero. Right-side canvas at 40% opacity, 40% width.
     ============================================ */
  .hero-after{
    background: #141e42;
  }
  .hero-after::before{
    /* subtle ambient glow only */
    content: ""; position: absolute;
    top: -300px; left: -200px;
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(25,90,221,0.18), transparent 60%);
    filter: blur(40px);
    pointer-events: none;
  }
  .hero-after .grid-bg{
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(210,204,241,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(210,204,241,0.04) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse 90% 60% at 30% 50%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 90% 60% at 30% 50%, black 30%, transparent 75%);
    pointer-events: none;
  }
  .hero-after .canvas-side{
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 40%;
    opacity: 0.4;
    pointer-events: none;
    overflow: hidden;
    mask-image: linear-gradient(90deg, transparent 0%, black 25%, black 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 25%, black 100%);
  }
  .hero-after .canvas-side svg{ width: 100%; height: 100%; display: block; }
  .hero-after .nav{
    position: absolute; top: 0; left: 0; right: 0; height: 76px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 56px; border-bottom: 1px solid var(--line);
    background: rgba(20,30,66,0.72); backdrop-filter: blur(14px);
    z-index: 5;
  }
  .hero-after .nav .lg{ font-weight: 600; font-size: 18px; letter-spacing: -0.02em; color: white; font-family: 'Inter Tight', sans-serif; }
  .hero-after .nav ul{ list-style: none; display: flex; gap: 36px; padding: 0; margin: 0; font-size: 13px; color: var(--muted); font-weight: 500; }
  .hero-after .nav .nav-cta{
    background: var(--blue); color: white; padding: 10px 18px; border-radius: 10px;
    font-size: 13px; font-weight: 600;
    box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 8px 24px -8px rgba(25,90,221,0.6);
  }
  .hero-after .content{
    position: absolute; inset: 76px 0 0 0;
    display: flex; align-items: center;
    padding: 0 80px;
    z-index: 4;
  }
  .hero-after .content-inner{ max-width: 760px; }
  .hero-after .badge{
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(210,204,241,0.05); border: 1px solid var(--line-strong);
    font-size: 12.5px; color: var(--lavender); font-weight: 500;
    margin-bottom: 32px;
  }
  .hero-after .badge::before{
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: #4ee79b; box-shadow: 0 0 10px #4ee79b;
  }
  .hero-after h1{
    font-family: 'Inter Tight', sans-serif;
    font-weight: 500;
    font-size: 96px;
    line-height: 1.0;
    letter-spacing: -0.03em;
    margin: 0 0 28px;
    color: white;
  }
  .hero-after h1 .grad{
    background: linear-gradient(120deg, #ffffff 0%, #d2ccf1 60%, #6f5dd2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero-after .sub{
    font-size: 20px; color: var(--muted);
    max-width: 580px; margin: 0 0 44px; line-height: 1.5;
  }
  .hero-after .ctas{ display: flex; gap: 12px; }
  .hero-after .btn{
    padding: 15px 26px; border-radius: 12px; font-weight: 600;
    font-size: 15px; font-family: 'Manrope', sans-serif;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .hero-after .btn-primary{
    background: var(--blue); color: white;
    box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 8px 24px -8px rgba(25,90,221,0.6);
  }
  .hero-after .btn-ghost{
    background: rgba(210,204,241,0.04); color: white;
    border: 1px solid var(--line-strong);
  }

  /* ============================================
     PROOF BAR — BEFORE
     Small numbers, bright blue bar
     ============================================ */
  .proof-before{
    background: #195add;
    display: flex; align-items: center; justify-content: center;
    padding: 50px 0;
  }
  .proof-before .row{
    display: grid; grid-template-columns: repeat(4, 1fr);
    width: 100%; max-width: 1300px; padding: 0 80px;
    text-align: center;
  }
  .proof-before .col{ border-right: 1px solid rgba(255,255,255,0.18); }
  .proof-before .col:last-child{ border-right: none; }
  .proof-before .num{
    font-family: 'Inter Tight', sans-serif;
    font-weight: 600; font-size: 56px;
    color: white; letter-spacing: -0.02em; line-height: 1;
  }
  .proof-before .lbl{
    font-size: 12px; color: rgba(255,255,255,0.85);
    text-transform: uppercase; letter-spacing: 0.1em;
    margin-top: 16px; font-weight: 600;
  }

  /* ============================================
     PROOF BAR — AFTER
     Massive gradient numbers, secondary navy bg
     ============================================ */
  .proof-after{
    background: #0d3084;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .proof-after::before{
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(25,90,221,0.3), transparent 60%),
      radial-gradient(ellipse at 80% 50%, rgba(111,93,210,0.25), transparent 60%);
    pointer-events: none;
  }
  .proof-after::after{
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
  }
  .proof-after .row{
    display: grid; grid-template-columns: repeat(4, 1fr);
    width: 100%; max-width: 1500px; padding: 0 80px;
    position: relative; z-index: 1;
    gap: 40px;
  }
  .proof-after .col{ position: relative; }
  .proof-after .col:not(:last-child)::after{
    content: ""; position: absolute;
    right: -20px; top: 20%; bottom: 20%;
    width: 1px; background: rgba(210,204,241,0.15);
  }
  .proof-after .num{
    font-family: 'Inter Tight', sans-serif;
    font-weight: 500;
    font-size: 124px;
    line-height: 0.95;
    letter-spacing: -0.04em;
    background: linear-gradient(120deg, #195add 0%, #6f5dd2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .proof-after .lbl{
    font-size: 11px; color: rgba(247,247,247,0.6);
    text-transform: uppercase; letter-spacing: 0.16em;
    margin-top: 24px; font-weight: 600;
  }

  /* ============================================
     PRICING — BEFORE
     Four equal tiers, no anchor
     ============================================ */
  .pricing-before, .pricing-after{
    padding: 60px 56px;
    overflow-y: auto;
  }
  .pricing-before .ph{ text-align: center; margin-bottom: 56px; }
  .pricing-before .ph .ey{ font-size: 11px; letter-spacing: 0.16em; color: var(--blue); text-transform: uppercase; font-weight: 600; margin-bottom: 14px; }
  .pricing-before .ph h2{
    font-family: 'Inter Tight', sans-serif;
    font-weight: 500; font-size: 44px; letter-spacing: -0.02em;
    line-height: 1.1; margin: 0; color: white;
  }
  .pricing-before .grid{
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    max-width: 1700px; margin: 0 auto;
  }
  .pricing-before .tier{
    background: rgba(20,30,66,0.95);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 28px;
    display: flex; flex-direction: column; min-height: 380px;
  }
  .pricing-before .tier .level{
    font-size: 11px; letter-spacing: 0.14em; color: var(--blue);
    text-transform: uppercase; font-weight: 600; margin-bottom: 18px;
  }
  .pricing-before .tier h3{
    font-family: 'Inter Tight', sans-serif;
    font-weight: 500; font-size: 22px;
    margin: 0 0 12px; color: white; letter-spacing: -0.01em;
  }
  .pricing-before .tier .price{
    font-family: 'Inter Tight', sans-serif;
    font-size: 24px; font-weight: 500; color: white; letter-spacing: -0.01em;
  }
  .pricing-before .tier .term{ font-size: 12px; color: var(--dim); margin-top: 4px; margin-bottom: 18px; }
  .pricing-before .tier p{
    font-size: 13.5px; color: var(--muted); line-height: 1.55; margin: 0 0 24px;
    flex: 1;
  }
  .pricing-before .tier .cta{
    padding: 11px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
    background: rgba(210,204,241,0.06); color: white;
    border: 1px solid var(--line-strong); text-align: center;
  }

  /* ============================================
     PRICING — AFTER
     Flagship gets gradient border + scale + popular pill
     ============================================ */
  .pricing-after .ph{ text-align: center; margin-bottom: 56px; }
  .pricing-after .ph .ey{ font-size: 11px; letter-spacing: 0.16em; color: var(--blue); text-transform: uppercase; font-weight: 600; margin-bottom: 14px; }
  .pricing-after .ph h2{
    font-family: 'Inter Tight', sans-serif;
    font-weight: 500; font-size: 44px; letter-spacing: -0.02em;
    line-height: 1.1; margin: 0; color: white;
  }
  .pricing-after .grid{
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
    max-width: 1700px; margin: 28px auto 0;
    align-items: stretch;
  }
  .pricing-after .tier{
    background: rgba(20,30,66,0.95);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 32px 28px;
    display: flex; flex-direction: column;
    position: relative;
    min-height: 380px;
  }
  .pricing-after .tier .level{
    font-size: 11px; letter-spacing: 0.14em; color: var(--lavender); opacity: 0.7;
    text-transform: uppercase; font-weight: 600; margin-bottom: 18px;
  }
  .pricing-after .tier h3{
    font-family: 'Inter Tight', sans-serif;
    font-weight: 500; font-size: 22px;
    margin: 0 0 12px; color: white; letter-spacing: -0.01em;
  }
  .pricing-after .tier .price{
    font-family: 'Inter Tight', sans-serif;
    font-size: 24px; font-weight: 500; color: white; letter-spacing: -0.01em;
  }
  .pricing-after .tier .term{ font-size: 12px; color: var(--dim); margin-top: 4px; margin-bottom: 18px; }
  .pricing-after .tier p{
    font-size: 13.5px; color: var(--muted); line-height: 1.55; margin: 0 0 24px;
    flex: 1;
  }
  .pricing-after .tier .cta{
    padding: 11px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
    background: rgba(210,204,241,0.06); color: white;
    border: 1px solid var(--line-strong); text-align: center;
  }

  /* Flagship treatment */
  .pricing-after .tier.flagship{
    background:
      linear-gradient(180deg, rgba(28, 42, 96, 0.98), rgba(15, 22, 60, 0.98));
    transform: scale(1.04);
    z-index: 2;
    border: 1px solid transparent;
    background-clip: padding-box;
    box-shadow: 0 24px 48px -16px rgba(25, 90, 221, 0.35), 0 0 0 1px rgba(25,90,221,0.0);
  }
  .pricing-after .tier.flagship::before{
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(135deg, #195add 0%, #6f5dd2 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }
  .pricing-after .tier.flagship::after{
    /* ambient glow */
    content: ""; position: absolute;
    inset: -20px; z-index: -1;
    background: radial-gradient(ellipse at 50% 0%, rgba(25,90,221,0.25), transparent 60%);
    filter: blur(20px); border-radius: 28px;
    pointer-events: none;
  }
  .pricing-after .tier.flagship .level{
    color: white; opacity: 1;
    background: linear-gradient(120deg, #195add, #6f5dd2);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .pricing-after .tier.flagship .popular{
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    background: var(--blue); color: white;
    padding: 6px 14px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    box-shadow: 0 8px 20px -6px rgba(25, 90, 221, 0.7), 0 1px 0 rgba(255,255,255,0.2) inset;
    white-space: nowrap;
  }
  .pricing-after .tier.flagship .popular::before{
    content: "★ "; color: white;
  }
  .pricing-after .tier.flagship .price{
    font-size: 28px;
  }
  .pricing-after .tier.flagship .cta{
    background: var(--blue);
    border: 1px solid var(--blue);
    box-shadow: 0 1px 0 rgba(255,255,255,0.18) inset, 0 8px 24px -8px rgba(25,90,221,0.6);
  }

  /* small caption strip per artboard pair (rendered inside the artboard) */
  .caption-tag{
    position: absolute; top: 16px; left: 16px;
    z-index: 10;
    padding: 5px 11px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
    pointer-events: none;
  }
  .caption-tag.before{ background: rgba(220, 80, 80, 0.18); color: #ffb4b4; border-color: rgba(220,80,80,0.4); }
  .caption-tag.after{ background: rgba(78, 231, 155, 0.16); color: #9cf2c5; border-color: rgba(78,231,155,0.35); }

  /* particle anim for the hero-after right canvas */
  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-10px, -8px); }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="mockups.jsx"></script>

</body>
</html>
